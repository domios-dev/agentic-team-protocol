# Expected result for an Agentic Team Protocol conformance fixture.
# Codes and locations come from a run of the reference validator (validator_run);
# the conformance corpus has no case for this rule. The validator reports the
# unsafe entry, the unsafe reference in team.yaml, and the reference's missing target.
# input.team is generated by `node scripts/pack-team.mjs`; its entries are declared there.
case: zip-entry-absolute
form: team-zip
input: input.team
errors:
  - rule: Archive entries and package paths are relative; absolute paths are refused.
    spec: spec/2026-11-11
    spec_section: "4.2.4"
    quote: "Every entry path MUST be relative. A path containing a `..` segment, an absolute path, and a symbolic link are errors (unsafe path)."
    location:
      file: input.team
      entry: /shared/notes.md
      detail: referenced from team.yaml files[0].path (entry team.yaml, line 8)
    severity: error
    code: absolute_path
    validator_run: https://github.com/domios-dev/agentic-team-protocol/actions/runs/43457952465
  - rule: Package paths are relative; an absolute reference path is refused.
    spec: spec/2026-11-11
    spec_section: "4.4.3"
    quote: "Paths are package-relative and follow the safety rule of section 4.2."
    location:
      file: input.team
      entry: team.yaml
      path: files[0].path
      line: 8
      column: 5
    severity: error
    code: absolute_path
    validator_run: https://github.com/domios-dev/agentic-team-protocol/actions/runs/43457952465
  - rule: Missing referenced file. The refused absolute path resolves to no package entry.
    spec: spec/2026-11-11
    spec_section: "4.4.2"
    quote: "A reference whose target is missing is an error (missing referenced file)."
    location:
      file: input.team
      entry: team.yaml
      path: files[0].path
      line: 8
      column: 5
    severity: error
    code: missing_file
    validator_run: https://github.com/domios-dev/agentic-team-protocol/actions/runs/43457952465
warnings: []
