# Expected result for an Agentic Team Protocol conformance fixture.
# Codes come from the Domios conformance corpus, corpus/2026-11-11/cases.json;
# corpus_case names the case that defines the same rule (the corpus case is a
# folder; the reference implementation checks it in every form).
# input.team is generated by `node scripts/pack-team.mjs`; its entries are declared there.
case: unreferenced-zip-entry
form: team-zip
input: input.team
errors:
  - rule: Every archive entry other than the root team.yaml is referenced by team.yaml.
    spec: spec/2026-11-11
    spec_section: "4.2.3"
    quote: "Every entry other than the root `team.yaml` MUST be the target of a reference (section 4.4). An unreferenced entry is an error (unreferenced entry)."
    location:
      file: input.team
      entry: notes/stray.md
      detail: team.yaml references only notes/guide.md
    severity: error
    code: unreferenced_entry
    corpus_case: invalid/unreferenced-entry
warnings: []
