# Expected result for an Agentic Team Protocol (ATP) conformance fixture.
# The code and location come from a run of the reference validator (validator_run);
# the conformance corpus has no case for this rule. The validator reports the
# missing name at the skills entry in team.yaml, not inside SKILL.md.
# sp_b3v164 has no sentence for this rule yet; the public spec is being amended to carry it.
case: path-skill-without-name
form: folder
input: input/
errors:
  - rule: A path skill's SKILL.md frontmatter carries a name; the folder name is never used as a fallback.
    spec: Orchestrator-relayed owner decision (Elgar, binding)
    spec_section: ATP package format, roles and model choice
    quote: "a skills entry with `path: skills/x` whose SKILL.md has no frontmatter `name`. ERROR (Agent Skills requires name; no folder-name fallback)."
    also_section: "Templates: one existing Team creation rail and default package"
    also: "skills (inline {name, description, content as SKILL.md, files[]} or {path: <SKILL.md folder>}) register as Team-scoped skills."
    location:
      file: input/team.yaml
      path: skills[0].path
      line: 8
      column: 9
      detail: input/skills/source-check/SKILL.md has a frontmatter (lines 1-3) with description but no name
    severity: error
    code: missing_field
    validator_run: https://github.com/domios-dev/agentic-team-protocol/actions/runs/43267871169
warnings: []
