# Expected result for an Agentic Team Protocol (ATP) conformance fixture.
# Codes come from the Domios conformance corpus, corpus/2026-11-11/cases.json;
# corpus_case names the case that defines the same rule. The corpus case exercises
# min > max; the reference implementation reports both conditions as one rule.
case: schedule-bad-duration
form: single-file
input: input.team.yaml
errors:
  - rule: Each schedule bound is a duration matching <positive integer>(m|h).
    spec: spec/2026-11-11
    spec_section: "10.4.1"
    quote: "Each duration MUST match `<positive integer>(m|h)`, where `m` means minutes and `h` means hours, for example `45m` or `2h`. Any other duration is an error (invalid schedule)."
    location:
      file: input.team.yaml
      path: managers.curator.start.schedule
      line: 13
      detail: min 45x has unit x; only m and h are allowed
    severity: error
    code: invalid_schedule
    corpus_case: invalid/invalid-schedule.team.yaml
warnings: []
