# Expected result for an Agentic Team Protocol conformance fixture.
# Codes come from the Domios conformance corpus, corpus/2026-11-11/cases.json;
# corpus_case names the case that defines the same rule.
# The input is the canonical com.example/research-desk 2.1.0 team.yaml, byte for
# byte (packages/com.example/research-desk/2.1.0/research-desk/team.yaml), used as a
# single file. It is valid only as a folder or .team ZIP: every reference it makes is
# path-only, and a single file carries no inline content for any of them.
case: path-only-in-single-file
form: single-file
input: input.team.yaml
errors:
