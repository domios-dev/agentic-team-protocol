# Expected result for an Agentic Team Protocol (ATP) conformance fixture.
# Codes and locations come from the Domios conformance corpus,
# corpus/2026-11-11/cases.json; corpus_case names the case that defines the same
# rule. The corpus reports a top-level `roles` block as a removed field and a
# missing `managers` mapping at `managers`.
# A minimal authored package in the superseded `roles:` shape (top-level
# instructions plus a roles block instead of managers/workers).
case: removed-roles-instructions
form: single-file
input: input.team.yaml
errors:
  - rule: There is no top-level `instructions` field.
    spec: spec/2026-11-11
    spec_section: "11"
    quote: "top-level `instructions` (a role's own `instructions` stays valid)"
    location:
      file: input.team.yaml
      path: instructions
      line: 10
    severity: error
    code: removed_field
    corpus_case: invalid/removed-top-instructions.team.yaml
  - rule: The superseded top-level `roles` block is refused as a removed field.
    spec: spec/2026-11-11
    spec_section: "11"
    quote: "top-level `roles` (roles are declared under `managers` and `workers`)"
    location:
      file: input.team.yaml
      path: roles
      line: 14
    severity: error
    code: removed_field
    corpus_case: invalid/release-train.team.yaml
  - rule: managers.orchestrator is required, so the managers mapping is required.
    spec: spec/2026-11-11
    spec_section: "6.2"
    quote: "The REQUIRED keys are `name`, `version`, `description` and `managers.orchestrator`. All other top-level keys are OPTIONAL. A missing required key is an error (missing required key)."
    location:
      file: input.team.yaml
      path: managers
      line: 1
      column: 5
      detail: the document has no managers mapping; the reference validator reports it at the document's first key (validator_run)
    severity: error
    code: missing_field
    corpus_case: invalid/release-train.team.yaml
    validator_run: https://github.com/domios-dev/agentic-team-protocol/actions/runs/43267871169
warnings: []
