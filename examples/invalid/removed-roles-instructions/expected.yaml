# Expected result for an Agentic Team Protocol (ATP) conformance fixture.
# Codes and locations come from the Domios conformance corpus,
# corpus/2026-11-11/cases.json; corpus_case names the case that defines the same
# rule. The corpus reports a top-level `roles` block as a removed field and a
# missing `managers` mapping at `managers`.
# A minimal authored package in the superseded `roles:` shape (top-level
# instructions plus a roles block instead of managers/workers).
case: removed-roles-instructions
form: single-file
input: input.team.yaml
errors:
  - rule: There is no top-level `instructions` field.
    spec: sp_b3v164
    spec_section: ATP package format, roles and model choice
    quote: "There are no top-level instructions and no brief: every role carries its own instructions, the team's overall way of working is written in the orchestrator's instructions, and a starting hint for the planner lives in the planner's instructions."
    location:
      file: input.team.yaml
      path: instructions
      line: 10
    severity: error
    code: removed_field
    corpus_case: invalid/removed-top-instructions.team.yaml
  - rule: The superseded top-level `roles` block is refused as a removed field.
    spec: sp_b3v164
    spec_section: ATP package format, roles and model choice
    quote: "Every other non-`x-` key is strictly typed and unknown keys are errors; there are no top-level coordinator/planner fields."
    note: The reference implementation reports top-level `roles` as a removed field, not an unknown key; the public spec section 11 does not list it yet.
    location:
      file: input.team.yaml
      path: roles
      line: 14
    severity: error
    code: removed_field
    corpus_case: invalid/release-train.team.yaml
  - rule: managers.orchestrator is required, so the managers mapping is required.
    spec: sp_b3v164
    spec_section: ATP package format, roles and model choice
    quote: "Required: only name, version, description and managers.orchestrator."
    location:
      file: input.team.yaml
      path: managers
      detail: the document has no managers mapping
    severity: error
    code: missing_field
    corpus_case: invalid/release-train.team.yaml
warnings: []
