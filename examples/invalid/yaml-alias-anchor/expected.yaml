# Expected result for an Agentic Team Protocol conformance fixture.
# Codes come from the Domios conformance corpus, corpus/2026-11-11/cases.json;
# corpus_case names the case that defines the same rule. The invalid_model error
# the alias leaves behind comes from a run of the reference validator (validator_run).
case: yaml-alias-anchor
form: single-file
input: input.team.yaml
errors:
  - rule: YAML anchors are not allowed.
    spec: spec/2026-11-11
    spec_section: "5.2"
    quote: "A package document MUST NOT contain anchors or aliases (YAML anchor or alias)."
    location:
      file: input.team.yaml
      path: roles.researcher.model
      line: 15
      column: 26
      detail: anchor &shared_model on the flow sequence that starts at column 26
    severity: error
    code: yaml_anchor
    corpus_case: invalid/anchor-alias.team.yaml
  - rule: YAML aliases are not allowed.
    spec: spec/2026-11-11
    spec_section: "5.2"
    quote: "A package document MUST NOT contain anchors or aliases (YAML anchor or alias)."
    location:
      file: input.team.yaml
      path: roles.writer.model
      line: 21
      column: 12
      detail: alias *shared_model
    severity: error
    code: yaml_alias
    corpus_case: invalid/anchor-alias.team.yaml
  - rule: A model is a list of model ids or a same_as mapping; the alias leaves no model value.
    spec: spec/2026-11-11
    spec_section: "15.1"
    quote: "a model list entry that is not `<harness>:<model>`, reported at that entry; also an empty model list, or a `model` scalar other than `inherit`."
    location:
      file: input.team.yaml
      path: roles.writer.model
      line: 21
      column: 12
      detail: the alias *shared_model is read as an empty scalar
    severity: error
    code: invalid_model
    validator_run: https://github.com/domios-dev/agentic-team-protocol/actions/runs/43457952465
warnings: []
