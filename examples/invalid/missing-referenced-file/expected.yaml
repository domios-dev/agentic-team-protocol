# corpus_case names the case that defines the same rule.
# PROVISIONAL roles-map draft, pending: Domios validator (task_a567lk). The final
# pass reruns it against the regenerated corpus and validator and fixes sources and locations.
case: missing-referenced-file
form: folder
input: input/
errors:
  - rule: Missing referenced file. The icon must point at a file that exists in the package.
    spec: spec/2026-11-11
    spec_section: "7.1.2"
    quote: "A missing icon target is an error (missing referenced file)."
    location:
      file: input/team.yaml
      path: icon
      line: 4
      detail: input/assets/icon.svg does not exist in the folder
    severity: error
    code: missing_file
    corpus_case: invalid/icon-missing.team.yaml
warnings: []
