name: com.example/same-as-cycle
version: 1.0.0
description: Package whose two workers follow each other's model.
authors:
  - name: Example Author
    url: https://example.com
managers:
  orchestrator:
    instructions: |
      Coordinate the team.
workers:
  researcher:
    description: Researches one angle.
    model:
      same_as: checker
    instructions: |
      Research exactly one angle.
  checker:
    description: Verifies every claim.
    model:
      same_as: researcher
    instructions: |
      Verify every claim against its source.
