# Expected result for an Agentic Team Protocol (ATP) conformance fixture.
# Codes come from the Domios conformance corpus, corpus/2026-11-11/cases.json;
# corpus_case names the case that defines the same rule. The first code stays
# pending: the corpus reports this rule (binary_inline, invalid/icon-png-inline.team.yaml)
# only for a PNG icon with inline content; this input has none.
case: png-icon-single-file
form: single-file
input: input.team.yaml
errors:
  - rule: A PNG icon needs the folder or .team form; the single-file form cannot carry it.
    spec: sp_b3v164
    spec_section: ATP package format, roles and model choice
    quote: "An SVG may be inline in the single-file form through a `files` entry with `content`; a PNG needs the folder or `.team` form."
    location:
      file: input.team.yaml
      path: icon
      line: 4
    severity: error
    code: pending
  - rule: Missing referenced file. The single file has no inline target for the icon path.
    spec: sp_b3v164
    spec_section: ATP package format, roles and model choice
    quote: "The validator refuses a missing or non-image target."
    decision: "Orchestrator-relayed owner decision (Elgar, binding): in the single-file form every reference must resolve inline; a path-only reference with no inline content is a missing referenced file."
    location:
      file: input.team.yaml
      path: icon
      line: 4
      detail: assets/logo.png
    severity: error
    code: missing_file
    corpus_case: invalid/icon-missing.team.yaml
warnings: []
