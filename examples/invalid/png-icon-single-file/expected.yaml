# Expected result for an Agentic Team Protocol (ATP) conformance fixture.
# Codes come from the Domios conformance corpus, corpus/2026-11-11/cases.json;
# corpus_case names the case that defines the same rule. A path-only PNG icon in
# the single-file form is only a missing referenced file; the inline-binary-icon
# error (binary_inline) applies to inline content (spec section 7.1, item 5).
# PROVISIONAL roles-map draft, pending: Domios validator (task_a567lk). The final
# pass reruns it against the regenerated corpus and validator and fixes sources and locations.
case: png-icon-single-file
form: single-file
input: input.team.yaml
errors:
  - rule: Missing referenced file. The single file has no inline target for the icon path.
    spec: spec/2026-11-11
    spec_section: "7.1.5"
    quote: "A PNG icon path with no inline content and no package file is a missing referenced file (item 2)."
    location:
      file: input.team.yaml
      path: icon
      line: 4
      detail: assets/logo.png
    severity: error
    code: missing_file
    corpus_case: invalid/icon-missing.team.yaml
warnings: []
