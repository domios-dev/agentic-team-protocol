# Expected result for an Agentic Team Protocol (ATP) conformance fixture.
# Codes and locations come from a run of the reference validator (validator_run);
# the conformance corpus has no case for this rule. The validator reports the
# unsafe entry, the unsafe reference in team.yaml, and the reference's missing target.
# input.team is generated by `node scripts/pack-team.mjs`; its entries are declared there.
case: zip-entry-dotdot
form: team-zip
input: input.team
errors:
  - rule: Archive entries and package paths are relative and never contain `..`.
    spec: sp_b3v164
    spec_section: ATP package format, roles and model choice
    quote: "Archive and folder rules: exactly one root team.yaml; unreferenced entries are an error; relative paths only (no `..`, no absolute paths, no symlinks); explicit size and count bounds; deterministic entry order so export > import > export is byte-identical."
    location:
      file: input.team
      entry: ../shared/notes.md
      detail: referenced from team.yaml files[0].path (entry team.yaml, line 8)
    severity: error
    code: path_escape
    validator_run: https://github.com/domios-dev/agentic-team-protocol/actions/runs/43267871169
  - rule: Package paths never contain `..`; an escaping reference path is refused.
    spec: spec/2026-11-11
    spec_section: "4.4 References"
    quote: "Paths are package-relative and follow the safety rule of section 4.2."
    location:
      file: input.team
      entry: team.yaml
      path: files[0].path
      line: 8
      column: 5
    severity: error
    code: path_escape
    validator_run: https://github.com/domios-dev/agentic-team-protocol/actions/runs/43267871169
  - rule: Missing referenced file. The refused escaping path resolves to no package entry.
    spec: spec/2026-11-11
    spec_section: "4.4 References"
    quote: "A reference whose target is missing is an error (missing referenced file)."
    location:
      file: input.team
      entry: team.yaml
      path: files[0].path
      line: 8
      column: 5
    severity: error
    code: missing_file
    validator_run: https://github.com/domios-dev/agentic-team-protocol/actions/runs/43267871169
warnings: []
