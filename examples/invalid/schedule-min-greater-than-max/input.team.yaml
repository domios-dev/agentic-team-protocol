name: com.example/schedule-min-greater-than-max
version: 1.0.0
description: Package whose curator schedule has a minimum above its maximum.
authors:
  - name: Example Author
    url: https://example.com
roles:
  orchestrator:
    kind: manager
    instructions: |
      Coordinate the team.
  curator:
    kind: manager
    start:
      schedule: "2h..45m"
    model:
      same_as: orchestrator
    instructions: |
      Review the team's health and report to the orchestrator.
