name: com.example/research-desk
version: 2.1.0
title: Research desk
description: >-
  Researches a market question in parallel, cross-checks sources and writes a cited report.
icon: assets/icon.svg
authors:
  - name: Jane Doe
    email: jane@example.com
    url: https://example.com/jane
    role: maintainer
  - name: Example Labs
    url: https://example.com
links:
  homepage: https://example.com/teams/research-desk
  repository: https://github.com/example/teams
  issues: https://github.com/example/teams/issues
  docs: https://example.com/docs/research-desk
license: Apache-2.0
when:
  - research a market question
  - write a cited competitive report
derived_from:
  name: com.example/research-desk
  version: 2.0.3

project: required
requires:
  harnesses: [claude, codex]

inputs:
  question: The market question to research
  depth:
    description: How deep to go
    required: false
    default: standard
    choices: [quick, standard, deep]

permissions:
  network: [api.example.com, "*.wikipedia.org"]
  repo_write: true
  shell: true
  browser: false

secrets:
  - name: SEARCH_API_KEY
    purpose: Web search for the researcher role
    required: true
  - name: SLACK_WEBHOOK
    purpose: Optional digest to a channel
    required: false

files:
  - path: assets/icon.svg
    description: Package icon
  - path: essences/how-we-research.md
    description: Our research method; read before planning
  - path: templates/report.md
    description: Shape of the final report
  - path: data/competitors.csv
    description: Known competitors with segments
  - path: assets/logo.png
    description: Logo for the report cover

memory:
  - title: Prefer filings over press releases
    kind: rule
    body: When a filing and a press release disagree, trust the filing and note the conflict.
    tags: [sources]
  - title: Market sizes older than two years mislead
    kind: learning
    body: Past reports cited stale sizes; always state the year and flag figures older than two years.

skills:
  - path: skills/source-check
  - path: skills/market-sizing

automation:
  - path: blueprints/digest.yaml
    description: Posts a progress digest every hour while research runs
  - path: blueprints/stale-task-nudge.yaml
    description: Nudges the lead when a task has been idle for two hours

roles:
  orchestrator:
    kind: manager
    name: Lead
    start: with_team
    model: [claude:opus, codex:gpt-6.1-sol]
    reasoning: high
    skills: [source-check]
    tools: [mcp:io.github.example/search]
    files: [essences/how-we-research.md, templates/report.md]
    instructions_file: managers/orchestrator.md

  planner:
    kind: manager
    name: Atlas
    start: with_team
    instructions_file: managers/planner.md

  cartographer:
    kind: manager
    start: on_demand
    model: [claude:sonnet]
    files: [data/competitors.csv]
    instructions_file: managers/cartographer.md

  curator:
    kind: manager
    start:
      schedule: 45m..2h
    model:
      same_as: orchestrator
    instructions_file: managers/curator.md

  researcher:
    kind: worker
    description: Researches one angle of the question.
    model: [claude:sonnet, codex:gpt-6.1-sol]
    reasoning: medium
    skills: [market-sizing]
    tools: [mcp:io.github.example/search]
    files: [data/competitors.csv]
    instructions_file: workers/researcher.md

  checker:
    kind: worker
    description: Verifies every claim in a researcher's report.
    model: [codex:gpt-6.1-sol]
    reasoning: high
    skills: [source-check]
    instructions_file: workers/checker.md

  qa:
    kind: worker
    description: Checks the final report renders and every link resolves.
    model: [claude:haiku]
    instructions_file: workers/qa.md

  writer:
    kind: worker
    description: Turns merged findings into the final report.
    start: on_demand
    instructions_file: workers/writer.md

x-domios:
  min_version: "1.20"
