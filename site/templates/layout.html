<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>{{title}}</title>
<link rel="stylesheet" href="{{root}}assets/style.css">
<script src="{{root}}assets/search.js" defer></script>
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{root}}">Agentic Team Protocol</a>
    <div class="search" id="site-search" role="search" hidden>
      <input type="search" class="search-input" id="site-search-input" placeholder="Search" aria-label="Search the documentation" aria-controls="site-search-results" autocomplete="off" spellcheck="false">
      <kbd class="search-key" aria-hidden="true">/</kbd>
      <div class="search-results" id="site-search-results" hidden></div>
      <p class="visually-hidden" id="site-search-status" aria-live="polite"></p>
    </div>
    <nav class="header-nav" aria-label="Site">
{{header_nav}}
    </nav>
  </div>
</header>
<div class="{{layout_class}}">
  <details class="nav-mobile">
    <summary>Contents</summary>
    <nav class="sidebar-nav" aria-label="Documentation">
{{nav}}
    </nav>
  </details>
  <aside class="sidebar">
    <nav class="sidebar-nav" aria-label="Documentation">
{{nav}}
    </nav>
  </aside>
  <main id="content" class="doc">
{{notice}}
{{content}}
  </main>
{{toc}}
</div>
<footer class="site-footer">
  <div class="footer-inner">
    <p>The Agentic Team Protocol specification is licensed under Apache-2.0. Each package carries its own license.</p>
    <p class="footer-links"><a href="{{root}}LICENSE.txt">License</a> <a href="https://github.com/domios-dev/agentic-team-protocol">Repository</a> <a class="by-domios" href="https://domios.dev"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path fill="currentColor" fill-rule="evenodd" d="M8 8H32C46 8 56 18 56 32S46 56 32 56H24L40 40V24H24V40L8 56Z"/></svg><span>by Domios</span></a></p>
  </div>
</footer>
</body>
</html>
