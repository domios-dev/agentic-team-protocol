# Conformance of everything this repository publishes, checked the way an outside
# consumer would: on fresh GitHub-hosted runners without Domios, the reference validator
# is installed by running the install commands of validator/README.md verbatim from the
# GitHub Release, then scripts/conformance.mjs runs it (and the committed WebAssembly
# module) over every package form, every example and every corpus case. Any mismatch
# with the recorded expectations fails the job.
#
# The reproduce job then requires every platform's result summary to be byte-identical.
name: Conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-consumer:
    name: Clean consumer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            install: posix
            target: x86_64-unknown-linux-musl
          - os: macos-15
            install: posix
            target: aarch64-apple-darwin
          - os: windows-2025
            install: powershell
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm Domios is absent
        run: |
          for cmd in domios codeterm; do
            if command -v "$cmd"; then echo "::error::$cmd is installed on this runner"; exit 1; fi
          done
          echo "no domios or codeterm command on PATH"

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The install block of validator/README.md for this platform, unchanged except the
      # `target=` line the README tells macOS readers to set.
      - name: Extract the install commands from validator/README.md
        run: |
          mkdir -p "$RUNNER_TEMP/install"
          lang=${{ matrix.install == 'posix' && 'sh' || 'powershell' }}
          script="$RUNNER_TEMP/install/install.${{ matrix.install == 'posix' && 'sh' || 'ps1' }}"
          awk -v marker="<!-- install:${{ matrix.install }} -->" -v fence="\`\`\`$lang" '
            $0 == marker { found = 1; next }
            found && $0 == fence { inside = 1; next }
            inside && /^```/ { exit }
            inside { print }
          ' validator/README.md > "$script"
          test -s "$script"
          if [ "${{ matrix.install }}" = posix ]; then
            sed -i.bak 's/^target=.*/target=${{ matrix.target }}/' "$script" && rm "$script.bak"
          fi
          cat "$script"

      - name: Install the validator (POSIX)
        if: matrix.install == 'posix'
        working-directory: ${{ runner.temp }}/install
        run: |
          sh -e install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the validator (PowerShell)
        if: matrix.install == 'powershell'
        working-directory: ${{ runner.temp }}/install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./install.ps1
          "$HOME\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Run conformance
        run: node scripts/conformance.mjs --summary "conformance-${{ matrix.target }}.json"

      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-${{ matrix.target }}
          path: conformance-${{ matrix.target }}.json
          if-no-files-found: error

  reproduce:
    name: Same results on every platform
    needs: clean-consumer
    runs-on: ubuntu-24.04
    steps:
      - name: Download every summary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: conformance-*
          merge-multiple: true
          path: summaries

      - name: Compare
        run: |
          ls -l summaries
          test "$(ls summaries/*.json | wc -l)" -eq 3
          sha256sum summaries/*.json
          test "$(sha256sum summaries/*.json | cut -d' ' -f1 | sort -u | wc -l)" -eq 1
          jq -r '"\(.runs | length) runs, \([.runs[] | select(.pass)] | length) passed, validator \(.validator_version)"' summaries/conformance-x86_64-unknown-linux-musl.json
