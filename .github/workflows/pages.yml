# Builds the static Agentic Team Protocol site on every pull request and push to main.
# Deployment to GitHub Pages runs only for a push to main while the repository
# variable PAGES_PUBLISH is 'true' (the owner's publication switch).
name: Pages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the immutability check compares packages/ with the base commit.
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A published package version never changes: compare packages/ with the PR
      # base, or with the previous main commit on a push.
      - name: Check published versions are immutable
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-immutability.mjs --base "$BASE_SHA" --head HEAD

      # Each .team ZIP holds exactly its folder's files byte for byte and re-packs
      # identically, so the catalog's per-form checksums describe one package.
      - name: Check package forms
        run: node scripts/check-forms.mjs

      # Also generates _site/catalog.json from git (scripts/build-catalog.mjs).
      - name: Build site
        run: npm run build

      # Every relative link and #fragment in _site/ must resolve to a built file and an
      # id in the target page. External links are listed, not fetched.
      - name: Check internal links
        run: node scripts/check-links.mjs

      # Every catalog checksum must equal the SHA-256 of the bytes _site/ serves,
      # and catalog.json must be byte-identical to a fresh generation.
      - name: Verify catalog checksums against served bytes
        run: node scripts/build-catalog.mjs --verify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/
          # Package and example files are served exactly as committed, dotfiles included.
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
