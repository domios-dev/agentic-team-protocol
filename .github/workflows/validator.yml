# Builds the Agentic Team Protocol reference validator, its WebAssembly module and the
# JSON Schema from one pinned commit of the Domios reference implementation, on
# GitHub-hosted runners, and runs the built validator over examples/ and packages/.
#
# Everything is uploaded as workflow artifacts only: no release, no Pages, no commit.
# The manifest artifact records every file's SHA-256, the exact commands, the Domios
# commit, the toolchain versions and this run's URL; PROVENANCE.md cites it.
#
# The Domios commit is pinned in exactly one place: DOMIOS_SHA below.
name: Validator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/validator.yml
      - validator/**
      - examples/**

permissions:
  contents: read

env:
  DOMIOS_REPOSITORY: domios-dev/domios
  DOMIOS_SHA: abe52ab407be6db0b1e9e3bc26fedd8db4cb8a49
  SPEC_VERSION: 2026-11-11
  CARGO_TERM_COLOR: never

jobs:
  native:
    name: atp-validate ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            exe: atp-validate
          - target: aarch64-apple-darwin
            os: macos-15
            exe: atp-validate
          - target: x86_64-apple-darwin
            os: macos-15
            exe: atp-validate
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            exe: atp-validate.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out Domios at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DOMIOS_REPOSITORY }}
          ref: ${{ env.DOMIOS_SHA }}
          path: domios
          persist-credentials: false

      - name: Confirm the checked-out commit
        run: test "$(git -C domios rev-parse HEAD)" = "$DOMIOS_SHA"

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # rust-toolchain.toml in the Domios checkout pins the compiler.
      - name: Install the pinned toolchain and target
        working-directory: domios
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Build
        working-directory: domios/src-tauri
        run: cargo build --locked -p codeterm-team-package --bin atp-validate --release --target ${{ matrix.target }}

      - name: Collect the binary and build record
        run: |
          mkdir -p out
          suffix=""; case "${{ matrix.exe }}" in *.exe) suffix=".exe" ;; esac
          cp "domios/src-tauri/target/${{ matrix.target }}/release/${{ matrix.exe }}" "out/atp-validate-${{ matrix.target }}$suffix"
          cd domios
          jq -n \
            --arg target "${{ matrix.target }}" \
            --arg runner "${{ matrix.os }}" \
            --arg image "${ImageOS:-}/${ImageVersion:-}" \
            --arg rustc "$(rustc -vV)" \
            --arg cargo "$(cargo -V)" \
            --arg command "cd src-tauri && cargo build --locked -p codeterm-team-package --bin atp-validate --release --target ${{ matrix.target }}" \
            '{target: $target, runner: $runner, runner_image: $image, rustc: $rustc, cargo: $cargo, commands: [$command]}' \
            > "../out/build-${{ matrix.target }}.json"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atp-validate-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  wasm:
    name: WebAssembly module
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Domios at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DOMIOS_REPOSITORY }}
          ref: ${{ env.DOMIOS_SHA }}
          path: domios
          persist-credentials: false

      - name: Confirm the checked-out commit
        run: test "$(git -C domios rev-parse HEAD)" = "$DOMIOS_SHA"

      - name: Install the pinned toolchain and target
        working-directory: domios
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      # The wasm crate is its own workspace without a committed lockfile; the lockfile
      # this build generates is uploaded for provenance.
      - name: Build
        working-directory: domios/src-tauri/crates/codeterm-team-package-wasm
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli matching the resolved wasm-bindgen crate
        working-directory: domios/src-tauri/crates/codeterm-team-package-wasm
        run: |
          version=$(cargo metadata --format-version 1 --locked | jq -r '[.packages[] | select(.name == "wasm-bindgen") | .version] | unique | .[]')
          test "$(printf '%s\n' "$version" | wc -l)" -eq 1
          echo "WASM_BINDGEN_VERSION=$version" >> "$GITHUB_ENV"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Generate the web bindings
        working-directory: domios/src-tauri/crates/codeterm-team-package-wasm
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out/pkg"
          wasm-bindgen --target web --out-dir "$GITHUB_WORKSPACE/out/pkg" target/wasm32-unknown-unknown/release/atp_validate.wasm
          cp Cargo.lock "$GITHUB_WORKSPACE/out/Cargo.lock"

      - name: Build record
        working-directory: domios/src-tauri/crates/codeterm-team-package-wasm
        run: |
          jq -n \
            --arg runner ubuntu-24.04 \
            --arg image "${ImageOS:-}/${ImageVersion:-}" \
            --arg rustc "$(rustc -vV)" \
            --arg cargo "$(cargo -V)" \
            --arg bindgen "$(wasm-bindgen --version)" \
            --arg c1 "cd src-tauri/crates/codeterm-team-package-wasm && cargo build --release --target wasm32-unknown-unknown" \
            --arg c2 "cargo install wasm-bindgen-cli --version $WASM_BINDGEN_VERSION --locked" \
            --arg c3 "wasm-bindgen --target web --out-dir pkg target/wasm32-unknown-unknown/release/atp_validate.wasm" \
            '{target: "wasm32-unknown-unknown", runner: $runner, runner_image: $image, rustc: $rustc, cargo: $cargo, wasm_bindgen_cli: $bindgen, commands: [$c1, $c2, $c3]}' \
            > "$GITHUB_WORKSPACE/out/build-wasm32-unknown-unknown.json"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atp-validate-wasm
          path: out/
          if-no-files-found: error

  run:
    name: Schema and example run
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the Linux validator
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atp-validate-x86_64-unknown-linux-musl
          path: bin

      - name: Export the JSON Schema
        run: |
          chmod +x bin/atp-validate-x86_64-unknown-linux-musl
          mkdir -p out/schema/"$SPEC_VERSION"
          bin/atp-validate-x86_64-unknown-linux-musl schema --spec-version "$SPEC_VERSION" > out/schema/"$SPEC_VERSION"/team.schema.json
          jq -e --arg id "https://atp.domios.dev/schema/$SPEC_VERSION/team.schema.json" '.["$id"] == $id' out/schema/"$SPEC_VERSION"/team.schema.json

      # Every example and package form, under host profile none and domios. One JSON
      # line per run: the input, the profile, the exit code and the validator's report.
      - name: Run the validator over examples and packages
        run: |
          validate=bin/atp-validate-x86_64-unknown-linux-musl
          inputs=()
          for dir in examples/invalid/*/ examples/warnings/*/; do
            for name in input.team.yaml input.team input; do
              [ -e "$dir$name" ] && inputs+=("$dir$name")
            done
          done
          for version in packages/*/*/*/; do
            for path in "$version"*.team.yaml "$version"*.team; do
              [ -f "$path" ] && inputs+=("$path")
            done
            [ -f "$version$(basename "$(dirname "$version")")/team.yaml" ] && inputs+=("$version$(basename "$(dirname "$version")")")
          done
          : > out/examples-report.jsonl
          for input in "${inputs[@]}"; do
            for profile in none domios; do
              set +e
              report=$("$validate" "$input" --host-profile "$profile" --json 2> stderr.txt)
              status=$?
              set -e
              if ! printf '%s' "$report" | jq -e . > /dev/null 2>&1; then report=null; fi
              jq -nc --arg input "$input" --arg profile "$profile" --argjson exit "$status" \
                --argjson report "$report" --arg stderr "$(cat stderr.txt)" \
                '{input: $input, host_profile: $profile, exit: $exit, report: $report, stderr: $stderr}' \
                >> out/examples-report.jsonl
            done
          done
          echo "runs: $(wc -l < out/examples-report.jsonl)"
          jq -c '{input, host_profile, exit, codes: [.report.diagnostics[]? | "\(.code)@\(.path):\(.line // "-")"]}' out/examples-report.jsonl

      - name: Run record
        run: |
          jq -n \
            --arg c1 "atp-validate-x86_64-unknown-linux-musl schema --spec-version $SPEC_VERSION > schema/$SPEC_VERSION/team.schema.json" \
            --arg c2 "atp-validate-x86_64-unknown-linux-musl <input> --host-profile <none|domios> --json  (every examples/** input and packages/** form)" \
            '{commands: [$c1, $c2]}' > out/run.json

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schema-and-example-run
          path: out/
          if-no-files-found: error

  manifest:
    name: Manifest
    needs: [native, wasm, run]
    runs-on: ubuntu-24.04
    steps:
      - name: Download every artifact of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Write the manifest
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          cd artifacts
          files=$(find . -type f | sort | while read -r f; do
            jq -nc --arg artifact "$(echo "$f" | cut -d/ -f2)" --arg path "$(echo "$f" | cut -d/ -f3-)" \
              --arg sha256 "$(sha256sum "$f" | cut -d' ' -f1)" --argjson size "$(stat -c %s "$f")" \
              '{artifact: $artifact, path: $path, size: $size, sha256: $sha256}'
          done | jq -s .)
          builds=$(cat */build-*.json | jq -s .)
          run=$(cat schema-and-example-run/run.json)
          mkdir -p ../out
          jq -n --arg repo "$DOMIOS_REPOSITORY" --arg sha "$DOMIOS_SHA" --arg spec "$SPEC_VERSION" \
            --arg url "$RUN_URL" --arg wsha "$WORKFLOW_SHA" \
            --argjson builds "$builds" --argjson run "$run" --argjson files "$files" \
            '{domios_repository: $repo, domios_sha: $sha, crate: "codeterm-team-package", spec_version: $spec,
              run_url: $url, workflow_commit: $wsha, builder: "GitHub Actions (this repository, workflow validator.yml)",
              builds: $builds, example_run: $run, files: $files}' > ../out/manifest.json
          cat ../out/manifest.json

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest
          path: out/manifest.json
          if-no-files-found: error
